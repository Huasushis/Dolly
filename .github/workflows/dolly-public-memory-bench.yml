name: Dolly public memory retrieval

on:
  push:
    branches:
      - research/dolly-layer-2026-08-26
    paths:
      - "research/dolly_research_layer/public_retrieval_bench.py"
      - ".github/workflows/dolly-public-memory-bench.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locomo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download pinned LoCoMo data
        run: |
          mkdir -p .cache/datasets
          curl --fail --location --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/snap-research/locomo/3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376/data/locomo10.json \
            --output .cache/datasets/locomo10.json
          echo "repo_commit=3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376" > .cache/datasets/locomo.source.txt
          echo "file_blob=d95b872480b413d935821fdc3c84f8a8f5f29e73" >> .cache/datasets/locomo.source.txt
          ls -lh .cache/datasets/locomo10.json
      - name: Run LoCoMo evidence-retrieval diagnostics
        run: |
          python research/dolly_research_layer/public_retrieval_bench.py \
            --locomo .cache/datasets/locomo10.json \
            --out research/dolly_research_layer/out-public-locomo
      - name: Print summary
        run: cat research/dolly_research_layer/out-public-locomo/public_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: dolly-public-locomo-${{ github.sha }}
          path: research/dolly_research_layer/out-public-locomo/
          if-no-files-found: error
          retention-days: 30

  longmemeval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: .cache/datasets/longmemeval_s_cleaned.json
          key: longmemeval-s-cleaned-98d7416-v1
      - name: Download pinned LongMemEval-S-cleaned data
        run: |
          mkdir -p .cache/datasets
          if [ ! -s .cache/datasets/longmemeval_s_cleaned.json ]; then
            curl --fail --location --retry 5 --retry-all-errors \
              https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/98d7416c24c778c2fee6e6f3006e7a073259d48f/longmemeval_s_cleaned.json?download=true \
              --output .cache/datasets/longmemeval_s_cleaned.json
          fi
          ls -lh .cache/datasets/longmemeval_s_cleaned.json
      - name: Run LongMemEval evidence-retrieval diagnostics
        run: |
          python research/dolly_research_layer/public_retrieval_bench.py \
            --longmemeval .cache/datasets/longmemeval_s_cleaned.json \
            --out research/dolly_research_layer/out-public-longmemeval
      - name: Print summary
        run: cat research/dolly_research_layer/out-public-longmemeval/public_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: dolly-public-longmemeval-${{ github.sha }}
          path: research/dolly_research_layer/out-public-longmemeval/
          if-no-files-found: error
          retention-days: 30

  publish-results:
    needs: [locomo, longmemeval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dolly-layer-2026-08-26
      - uses: actions/download-artifact@v4
        with:
          pattern: dolly-public-*-${{ github.sha }}
          path: downloaded-public-results
          merge-multiple: false
      - name: Stage immutable result snapshot
        run: |
          target=research/dolly_research_layer/results/public/${GITHUB_SHA}
          mkdir -p "$target/locomo" "$target/longmemeval"
          cp -a downloaded-public-results/dolly-public-locomo-${GITHUB_SHA}/. "$target/locomo/"
          cp -a downloaded-public-results/dolly-public-longmemeval-${GITHUB_SHA}/. "$target/longmemeval/"
          printf '%s\n' "source_commit=${GITHUB_SHA}" "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$target/run.txt"
      - name: Commit result snapshot to research branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/dolly_research_layer/results/public/${GITHUB_SHA}
          git commit -m "research(results): public memory retrieval ${GITHUB_SHA}" \
            || { echo "No result changes"; exit 0; }
          git push origin HEAD:research/dolly-layer-2026-08-26
