[package]
name = "dolly-asset"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core-owned binary Asset service (WP-010): bounded fail-closed import, canonical AssetRef, retention and GC."
autotests = false

[dependencies]
dolly-canonical-json = { path = "../dolly-canonical-json" }
dolly-core-domain = { path = "../dolly-core-domain" }
blake3 = "1.7"
getrandom = "0.3"
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
parking_lot = "0.12"
tempfile = "3"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
