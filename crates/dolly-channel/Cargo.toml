[package]
name = "dolly-channel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dolly-canonical-json = { path = "../dolly-canonical-json" }
dolly-core-domain = { path = "../dolly-core-domain" }
dolly-schema = { path = "../dolly-schema" }
dolly-storage = { path = "../dolly-storage" }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[features]
default = []
# Non-default test/conformance surface: exposes the crate-private store/intent
# records and the receiver test constructor for real-SQLite failpoint tests.
# Cannot expose real Host authority: opening a store still requires the sealed
# HostConnectionAuthority + HostCapabilityGrant.
test-support = []

[dev-dependencies]
dolly-core-reducer = { path = "../dolly-core-reducer" }
tempfile = "3"
