[package]
name = "dolly-filter-arithmetic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Two-Thirds Mean Filter arithmetic oracle: checked integer EMA, bias correction, mandatory clamp, and division-free two-thirds selection."

[dependencies]
dolly-canonical-json = { path = "../dolly-canonical-json" }
serde = { version = "1" }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }