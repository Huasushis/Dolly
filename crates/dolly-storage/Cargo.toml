[package]
name = "dolly-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = []
test-support = []

[dependencies]
dolly-canonical-json = { path = "../dolly-canonical-json" }
dolly-core-domain = { path = "../dolly-core-domain" }
getrandom = "0.3"
dolly-core-reducer = { path = "../dolly-core-reducer" }
dolly-tool-broker = { path = "../dolly-tool-broker" }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
