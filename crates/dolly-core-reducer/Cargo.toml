[package]
name = "dolly-core-reducer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dolly-core-domain = { path = "../dolly-core-domain" }
dolly-canonical-json = { path = "../dolly-canonical-json" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
dolly-schema = { path = "../dolly-schema" }
serde_json = { version = "1", features = ["preserve_order"] }
