[package]
name = "dolly-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
default = []
test-support = ["dolly-storage/test-support", "dolly-tool-coordinator/test-support"]

[dependencies]
dolly-canonical-json = { path = "../dolly-canonical-json" }
dolly-core-domain = { path = "../dolly-core-domain" }
dolly-protocol = { path = "../dolly-protocol" }
dolly-storage = { path = "../dolly-storage" }
dolly-tool-broker = { path = "../dolly-tool-broker" }
dolly-tool-coordinator = { path = "../dolly-tool-coordinator" }
getrandom = "0.3.4"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
